# Chainguard Actions parity demo.
#
# Two jobs run the EXACT same enterprise container pipeline:
#   checkout -> buildx -> (login) -> build/push -> Trivy scan -> cosign install/sign
#   - "upstream"   uses the community actions (actions/*, docker/*, aquasecurity/*, sigstore/*)
#   - "chainguard" uses the hardened drop-in replacements (chainguard-actions/*)
# The only difference between the two jobs is the org prefix on each `uses:` line.
#
# Several pins are deliberately held one release behind latest so Dependabot and
# the Chainguard GitHub App have real upgrades to propose:
#   checkout v7.0.0 (latest v7.0.1), trivy-action v0.35.0 (latest v0.36.0),
#   cosign-installer v4.1.1 (latest v4.1.2).
#
# A third job compares the resulting image digests to prove the builds are
# identical, and renders each Chainguard action's HARDENING.md for the exact
# SHA that ran — including which fixes landed in the shipped action code.
name: Parity Demo (upstream vs Chainguard)

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push + cosign-sign images in GHCR (uses GITHUB_TOKEN + OIDC, no extra secrets)"
        type: boolean
        default: false

# SOURCE_DATE_EPOCH makes the build reproducible so the two jobs produce an
# identical image digest.
env:
  SOURCE_DATE_EPOCH: "0"
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign signing via GitHub OIDC

jobs:
  # ---------------------------------------------------------------------------
  upstream:
    name: Build with UPSTREAM actions
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@7c40f1441ab5a6453743642606ee3fbd2f53d7ea # v7.0.0

      - name: Set up Buildx
        uses: chainguard-actions/docker-setup-buildx-action@af0c2a5efbc8ec52ea29c928cddd4cb3628ae1af # v4.2.0

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: chainguard-actions/docker-login-action@6bd875c5d06c5565abbf788cd1f64fe596f80fc5 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and optionally push)
        id: build
        uses: chainguard-actions/docker-build-push-action@f302eb38b46596cb0acad72ae4ac59709f66641b # v7.3.0
        with:
          context: .
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: ${{ env.IMAGE }}:upstream
          provenance: false
          sbom: false

      - name: Scan image (Trivy)
        uses: chainguard-actions/aquasecurity-trivy-action@c02135b2a61e8a6d603c53db55145af34b25ce4d # v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:upstream
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Install cosign
        uses: chainguard-actions/sigstore-cosign-installer@ee4cbe9d40f013d6e4f46bdec68986402d77163e # v4.1.1

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PUSHED: ${{ inputs.push }}
        run: |
          cosign version
          if [ "$PUSHED" = "true" ]; then
            cosign sign --yes "${IMAGE}@${DIGEST}"
          else
            echo "push disabled — skipping signature (run with PUSH=true to sign)"
          fi

      - name: Report digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "UPSTREAM digest = ${DIGEST}"

  # ---------------------------------------------------------------------------
  chainguard:
    name: Build with CHAINGUARD actions
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # Same steps, same VERSIONS as the upstream job, each pinned to an immutable SHA.
      # The only difference is the org prefix: `org/name` -> `chainguard-actions/org-name`
      # (the SHA differs because it's a different repo, but the version tag is identical).
      # Note: these repos publish `action.yml` only on release tags — `@main` holds just
      # metadata and never resolves, so pin to a real version/SHA.
      - name: Checkout
        uses: chainguard-actions/actions-checkout@7c40f1441ab5a6453743642606ee3fbd2f53d7ea # v7.0.0

      - name: Set up Buildx
        uses: chainguard-actions/docker-setup-buildx-action@695a7c62d4fe3f2071dbd659ecd5a8f9bc96e4dd # v4.2.0

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: chainguard-actions/docker-login-action@941346eb3be5464ccbd20997849095848ddafcdb # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and optionally push)
        id: build
        uses: chainguard-actions/docker-build-push-action@1d730b19ab3e753ee93137291b02df125e88eb3c # v7.3.0
        with:
          context: .
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: ${{ env.IMAGE }}:chainguard
          provenance: false
          sbom: false

      - name: Scan image (Trivy)
        uses: chainguard-actions/aquasecurity-trivy-action@c02135b2a61e8a6d603c53db55145af34b25ce4d # v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:chainguard
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Install cosign
        uses: chainguard-actions/sigstore-cosign-installer@ee4cbe9d40f013d6e4f46bdec68986402d77163e # v4.1.1

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PUSHED: ${{ inputs.push }}
        run: |
          cosign version
          if [ "$PUSHED" = "true" ]; then
            cosign sign --yes "${IMAGE}@${DIGEST}"
          else
            echo "push disabled — skipping signature (run with PUSH=true to sign)"
          fi

      - name: Report digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "CHAINGUARD digest = ${DIGEST}"

  # ---------------------------------------------------------------------------
  compare:
    name: Prove parity + security callout
    runs-on: ubuntu-latest
    needs: [upstream, chainguard]
    steps:
      - name: Compare digests
        env:
          UP: ${{ needs.upstream.outputs.digest }}
          CG: ${{ needs.chainguard.outputs.digest }}
        run: |
          {
            echo "## Chainguard Actions parity demo"
            echo ""
            echo "Both jobs ran the **same** build → scan → sign pipeline. The only diff was the \`uses:\` org prefix."
            echo ""
            echo "| Job | Actions source | Image digest |"
            echo "| --- | --- | --- |"
            echo "| upstream   | \`actions/*\`, \`docker/*\`, \`aquasecurity/*\`, \`sigstore/*\` | \`${UP:-n/a}\` |"
            echo "| chainguard | \`chainguard-actions/*\`                                      | \`${CG:-n/a}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$UP" ] && [ "$UP" = "$CG" ]; then
            echo "✅ **Identical image digest — the hardened actions are a true drop-in replacement.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ Digests not compared bit-for-bit in this run (push disabled or non-reproducible base). Both builds succeeded with identical steps — parity proven functionally." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Read the chainguard job's `uses:` pins straight from this workflow (so the
      # table always matches what ran, even after Dependabot bumps), then pull each
      # action's HARDENING.md at that exact SHA. Tags are rebuilt over time, so
      # reading by tag can show a different build's report than the one that ran.
      - name: Hardening report (live, per pinned SHA)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          wf="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/parity-demo.yml?ref=${GITHUB_SHA}" --jq .content | base64 -d)"
          mapfile -t PINS < <(printf '%s\n' "$wf" \
            | grep -oE 'chainguard-actions/[A-Za-z0-9._-]+@[0-9a-f]{40} # v[^ ]+' | sort -u)
          {
            echo ""
            echo "### 🔒 Hardening report — pulled live from each action's \`HARDENING.md\` at the pinned SHA"
            echo ""
            echo "Chainguard's hardening agent audits every action and fixes supply-chain weaknesses. These are the *actual* reports for the exact commits the \`chainguard\` job just ran — **click any action to open its full report**:"
            echo ""
            echo "| Action (pinned) | Findings fixed | Fixed in shipped action code | Vulnerability classes resolved |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for pin in "${PINS[@]}"; do
            ref="${pin%% *}"; ver="${pin##* }"
            repo="${ref#chainguard-actions/}"; repo="${repo%@*}"; sha="${ref#*@}"
            link="[\`${repo}@${ver}\`](https://github.com/chainguard-actions/${repo}/blob/${sha}/HARDENING.md)"
            body="$(curl -fsSL "https://raw.githubusercontent.com/chainguard-actions/${repo}/${sha}/HARDENING.md" || true)"
            if [ -z "$body" ]; then
              echo "| ${link} | _report unavailable_ | — | — |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            count="$(printf '%s' "$body" | grep -oE '[0-9]+ finding\(s\)' | head -1 | grep -oE '^[0-9]+' || echo 0)"
            iters="$(printf '%s' "$body" | grep -oE 'across [0-9]+ iteration' | grep -oE '[0-9]+' || echo 0)"
            classes="$(printf '%s\n' "$body" | grep -oE '^### [a-z-]+ \(severity: [a-z]+\)' | sed -E 's/^### ([a-z-]+) \(severity: ([a-z]+)\)/\1 (\2)/' | sort -u | paste -sd, - | sed 's/,/, /g' || true)"
            # Locations outside the upstream repo's own CI (.github/) are in code
            # every consumer actually executes.
            shipped="$(printf '%s\n' "$body" | grep -oE '^- `(action\.ya?ml|entrypoint\.sh|dist/[^:`]+|src/[^:`]+|lib/[^:`]+)' | sed 's/^- `//' | sort -u | paste -sd, - | sed 's/,/, /g' || true)"
            if [ "${count:-0}" = "0" ]; then
              echo "| ${link} | ✅ 0 — already clean | — | — |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| ${link} | 🛡️ ${count} fixed (${iters} iter) | ${shipped:+⚠️ \`${shipped}\`}${shipped:-repo CI only} | ${classes:-see report} |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          {
            echo ""
            echo "> Rows marked ⚠️ are fixes inside the action code itself — e.g. unsanitized writes to \`\$GITHUB_PATH\` and unquoted shell expansion of user input. The **same versions** of those community actions ran unpatched in the \`upstream\` job above."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Security callout (Chainguard-only)
        run: |
          {
            echo ""
            echo "### What the upstream job does NOT give you"
            echo ""
            echo "The \`chainguard-actions/*\` versions ship with, out of the box:"
            echo "- **SBOM** for every action"
            echo "- **Provenance attestation** (know exactly what ran and where it came from)"
            echo "- **A hardening report** — what was unsafe upstream, and what Chainguard fixed (see the table above)"
            echo "- **Continuous re-securing** when upstream changes or new attack techniques emerge"
            echo ""
            echo "> Same pipeline. Same result. One is continuously audited against supply-chain attacks (tag hijacking, pull_request_target abuse, secret exfiltration); the other is whatever the community last pushed."
          } >> "$GITHUB_STEP_SUMMARY"
